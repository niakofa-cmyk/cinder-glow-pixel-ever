name: Mastering checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: mastering-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test && npm run typecheck && npm run lint && npm run build
  browsers:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Provide Firefox a software audio device
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio rate=48000
          pactl set-default-sink ci_audio
      - name: Browser mastering and session regressions
        shell: bash
        run: |
          mkdir -p generated-artifacts
          npm run dev -- --port 5000 > generated-artifacts/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat generated-artifacts/server.log; exit 1; fi
          npm run test:browser -- --browser=${{ matrix.browser }} --no-editor-extensions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mastering-browser-evidence-${{ matrix.browser }}
          path: generated-artifacts/
          if-no-files-found: ignore
          retention-days: 7
