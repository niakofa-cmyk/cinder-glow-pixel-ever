name: Mastering checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: mastering-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test && npm run typecheck && npm run lint && npm run build
      - name: Browser mastering and session regressions
        shell: bash
        run: |
          mkdir -p generated-artifacts
          npm run dev -- --port 5000 > generated-artifacts/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat generated-artifacts/server.log; exit 1; fi
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mastering-browser-evidence
          path: generated-artifacts/
          if-no-files-found: ignore
          retention-days: 7
